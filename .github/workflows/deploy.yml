name: Deploy to GitHub Pages

on:
  # Manual only until F22 turns this workflow into the stub (SPEC §12.6): since
  # F13 the build has no basePath, so a run would break /pa-dashboard/.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GAS_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_GAS_SCRIPT_URL }}
          NEXT_PUBLIC_SYNC_PIN_CODE: ${{ secrets.NEXT_PUBLIC_SYNC_PIN_CODE }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
