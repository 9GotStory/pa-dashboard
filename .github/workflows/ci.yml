name: CI Check (Develop)

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      # Pure dashboard-data contract tests. The repo has no test runner
      # dependency, so compile the pure test graph to a temporary directory
      # with the existing TypeScript and run Node's built-in test runner on
      # the emitted JavaScript. trap removes the temp dir even on failure.
      - name: Run frontend dashboard data contract tests
        run: |
          TEST_OUT="$(mktemp -d)"
          trap 'rm -rf "$TEST_OUT"' EXIT
          npx tsc \
            --noEmit false \
            --incremental false \
            --module commonjs \
            --moduleResolution node \
            --target ES2022 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir "$TEST_OUT" \
            src/lib/dashboard-data.ts \
            src/lib/dashboard-data.test.ts \
            src/lib/dashboard-url-state.ts \
            src/lib/dashboard-url-state.test.ts \
            src/lib/kpi-utils.ts \
            src/lib/kpi-utils.test.ts \
            src/lib/types.ts \
            src/lib/kpi-grouping.ts
          node --test \
            "$TEST_OUT/dashboard-data.test.js" \
            "$TEST_OUT/dashboard-url-state.test.js" \
            "$TEST_OUT/kpi-utils.test.js"

      - name: Run frontend dashboard URL history contract tests
        run: node --test src/app/dashboard-url-state-contract.test.mjs

      - name: Run frontend accessibility contract tests
        run: node --test src/components/accessibility-contract.test.mjs

  backend:
    name: Backend Typecheck and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Run backend static tests
        run: node --test dist/test/database-foundation.static.test.js

      - name: Prove database integration suite is safely deferred
        run: node --test dist/test/database-foundation.integration.test.js
        env:
          TEST_DATABASE_URL: ""
          PA_ALLOW_DESTRUCTIVE_DB_TESTS: ""

      - name: Run backend HTTP foundation unit tests
        run: node --test dist/test/http-foundation.unit.test.js

      - name: Run backend read API unit tests
        run: node --test dist/test/read-api.unit.test.js

      - name: Prove backend read API integration suite is safely deferred
        run: node --test dist/test/read-api.integration.test.js
        env:
          TEST_DATABASE_URL: ""
          PA_ALLOW_DESTRUCTIVE_DB_TESTS: ""

      - name: Run backend reference population unit tests
        run: node --test dist/test/reference-population.unit.test.js

      - name: Prove backend reference population integration suite is safely deferred
        run: node --test dist/test/reference-population.integration.test.js
        env:
          TEST_DATABASE_URL: ""
          PA_ALLOW_DESTRUCTIVE_DB_TESTS: ""
          PA_REFERENCE_SOURCE_URL: ""
          PA_ALLOW_EXTERNAL_REFERENCE_FETCH: ""

  deployment:
    name: Deployment Contract and OCI Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run deployment contract tests
        run: node --test infra/test/deployment-contract.test.mjs

      # OCI build verification only: GitHub-hosted runners provide a Docker
      # engine, which is used to prove both Containerfiles build. Images are
      # never pushed, published or deployed.
      - name: Build web OCI image
        run: docker build -f infra/containers/web.Containerfile -t pa-dashboard-web:ci .

      - name: Build API OCI image
        run: docker build -f infra/containers/api.Containerfile -t pa-dashboard-api:ci .
