name: CI Check (Develop)

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # npm run lint diffs against origin/main (check-glossary.mjs)
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Stub files identical
        # SPEC §12.6: GitHub Pages serves the same stub as index.html and 404.html
        run: cmp legacy-redirect/index.html legacy-redirect/404.html

      - name: Build Test
        run: npm run build
        env:
          # prebuild reads the snapshot from GAS (build-snapshot.mjs, SPEC §6.2)
          NEXT_PUBLIC_GAS_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_GAS_SCRIPT_URL }}

      - name: Budget
        # SPEC §9.6: the JavaScript of / and /reports, and no font preload on the Data Center pages
        run: npm run dc:budget
